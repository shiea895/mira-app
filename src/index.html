<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わが家の倉庫番</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- S2: ホーム画面（在庫リスト） -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <span class="app-header__title">わが家の倉庫番</span>
    </header>

    <main class="app-main">
      <div id="category-tabs" class="category-tabs"></div>
      <div id="item-list" class="item-list"></div>
    </main>

    <button id="fab-add-item" class="fab" type="button" aria-label="アイテムを追加">＋</button>

    <nav class="bottom-nav">
      <button class="bottom-nav__item is-active" type="button" data-screen="screen-home">
        <span class="bottom-nav__icon material-symbols-rounded">home</span>
        <span class="bottom-nav__label">倉庫</span>
      </button>
      <button class="bottom-nav__item" type="button" data-screen="screen-shopping">
        <span class="bottom-nav__icon material-symbols-rounded">shopping_cart</span>
        <span class="bottom-nav__label">買い物リスト</span>
      </button>
      <button class="bottom-nav__item js-settings-btn" type="button">
        <span class="bottom-nav__icon material-symbols-rounded">settings</span>
        <span class="bottom-nav__label">設定</span>
      </button>
    </nav>
  </section>

  <!-- S3: 買い物リスト画面 -->
  <section id="screen-shopping" class="screen" hidden>
    <header class="app-header">
      <span class="app-header__title">買い物リスト</span>
      <span id="shopping-count" class="app-header__count"></span>
    </header>

    <main class="app-main">
      <div id="shopping-list"></div>
      <button id="finish-shopping-btn" class="finish-shopping-btn" type="button" hidden>買い物終了</button>
    </main>

    <nav class="bottom-nav">
      <button class="bottom-nav__item" type="button" data-screen="screen-home">
        <span class="bottom-nav__icon material-symbols-rounded">home</span>
        <span class="bottom-nav__label">倉庫</span>
      </button>
      <button class="bottom-nav__item is-active" type="button" data-screen="screen-shopping">
        <span class="bottom-nav__icon material-symbols-rounded">shopping_cart</span>
        <span class="bottom-nav__label">買い物リスト</span>
      </button>
      <button class="bottom-nav__item js-settings-btn" type="button">
        <span class="bottom-nav__icon material-symbols-rounded">settings</span>
        <span class="bottom-nav__label">設定</span>
      </button>
    </nav>
  </section>

  <!-- S5: アイコン選択画面 -->
  <section id="screen-icon-picker" class="screen" hidden>
    <header class="app-header">
      <button id="icon-picker-cancel" class="app-header__back" type="button" aria-label="キャンセル">←</button>
      <span class="app-header__title">アイコンを選択</span>
      <button id="icon-picker-confirm" class="app-header__save" type="button">決定</button>
    </header>

    <main class="app-main">
      <div class="icon-picker__preview-wrap">
        <div id="icon-picker-preview" class="item-tile__icon icon-picker__preview"></div>
      </div>

      <div class="icon-picker__actions">
        <button id="icon-picker-camera-btn" class="icon-picker__action-btn" type="button">📷 カメラで撮影</button>
        <button id="icon-picker-file-btn" class="icon-picker__action-btn" type="button">🖼 写真から選択</button>
      </div>
      <input id="icon-picker-camera-input" type="file" accept="image/*" capture="environment" hidden>
      <input id="icon-picker-file-input" type="file" accept="image/*" hidden>

      <div class="icon-picker__history">
        <span class="item-form__label">登録済みアイコンから選ぶ</span>
        <div id="icon-picker-history-grid" class="icon-picker__history-grid"></div>
      </div>
    </main>
  </section>

  <!-- S4: アイテム登録・編集画面 -->
  <section id="screen-item-form" class="screen" hidden>
    <header class="app-header">
      <button id="item-form-cancel" class="app-header__back" type="button" aria-label="キャンセル">←</button>
      <span id="item-form-title" class="app-header__title">アイテムを追加</span>
      <button id="item-form-save" class="app-header__save" type="button">保存</button>
    </header>

    <main class="app-main">
      <div class="item-form__icon-preview-wrap">
        <button id="item-form-icon-preview-btn" class="item-tile__icon item-form__icon-preview" type="button" aria-label="アイコンを選択"></button>
        <p class="item-form__icon-hint">タップしてアイコンを選択</p>
      </div>

      <label class="item-form__field">
        <span class="item-form__label">アイテム名</span>
        <input id="item-form-name" class="item-form__input" type="text" placeholder="例：牛乳">
      </label>

      <div class="item-form__field">
        <span class="item-form__label">カテゴリ</span>
        <div id="item-form-category" class="item-form__chip-group"></div>
      </div>

      <div class="item-form__field">
        <span class="item-form__label">在庫状態</span>
        <div id="item-form-status" class="item-form__chip-group"></div>
      </div>

      <label class="item-form__field">
        <span class="item-form__label">メモ（任意）</span>
        <textarea id="item-form-memo" class="item-form__textarea" rows="3" placeholder="例：〇〇スーパーの安いやつ"></textarea>
      </label>

      <button id="item-form-delete" class="item-form__delete" type="button" hidden>このアイテムを削除</button>
    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
